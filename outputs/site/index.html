<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="以聊天方式整理股票趨勢、新聞與投資風險。"><title>投資研究助手</title>
<style>
:root{color-scheme:light;--ink:#14221d;--muted:#697a72;--line:#dce7e1;--green:#167553;--bg:#f6f8f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:900px;margin:auto;padding:30px 22px 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:750;font-size:18px}.settings{border:1px solid var(--line);background:white;color:var(--ink);padding:9px 14px;border-radius:999px;cursor:pointer}h1{font-size:clamp(30px,5vw,44px);line-height:1.15;margin:54px 0 10px;letter-spacing:-.04em}.sub{color:var(--muted);margin:0 0 26px}.chips{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0 24px}.chip{border:1px solid var(--line);background:white;color:#315547;border-radius:999px;padding:8px 13px;cursor:pointer}#chat{display:flex;flex-direction:column;gap:17px;margin:24px 0}.msg{padding:15px 18px;border-radius:18px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#e3f1e9}.assistant{align-self:flex-start;background:white;border:1px solid var(--line)}.composer{position:sticky;bottom:12px;background:white;border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:0 8px 35px #14342412}.row{display:flex;gap:10px;align-items:end}textarea{resize:vertical;min-height:50px;max-height:160px;flex:1;border:0;outline:0;padding:12px;font:inherit}.send{background:var(--green);color:white;border:0;border-radius:14px;padding:12px 18px;font-weight:650;cursor:pointer}.send:disabled{opacity:.55;cursor:wait}.hint{font-size:12px;color:var(--muted);padding:5px 12px 1px}.notice{color:var(--muted);font-size:13px;margin:24px 2px}.modal{display:none;position:fixed;inset:0;background:#0b1912a8;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.panel{background:white;border-radius:22px;max-width:480px;width:100%;padding:22px}.panel label{display:block;margin:14px 0 6px;font-size:14px;font-weight:650}.panel input,.panel select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.panel-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.secondary{background:white;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}@media(max-width:600px){.shell{padding:20px 14px}.msg{max-width:96%}h1{margin-top:38px}.top{align-items:flex-start}}
</style></head><body><main class="shell">
<header class="top"><div class="brand">◉ 研究助手</div><button class="settings" id="openSettings">⚙ 設定</button></header>
<h1>用對話看懂市場</h1><p class="sub">問一檔股票，助手會整理近期趨勢、時事線索與風險。</p>
<div class="chips"><button class="chip">分析台積電近期走勢</button><button class="chip">0050 適合長期持有嗎？</button><button class="chip">NVDA 最近有什麼風險？</button></div>
<section id="chat" aria-live="polite"><div class="msg assistant">你好！告訴我你想看的股票或市場問題。我會先找近期資料，再整理趨勢、新聞可能影響和需要留意的風險。</div></section>
<form class="composer" id="form"><div class="row"><textarea id="prompt" placeholder="例如：分析台積電最近趨勢，適合分批買進嗎？" required></textarea><button class="send" id="send">送出</button></div><div class="hint">Enter 送出 · Shift+Enter 換行 · 對話只保存在此瀏覽器工作階段</div></form>
<p class="notice">行情可能延遲或缺漏，AI 解讀也可能有誤，請核對來源並自行評估風險。本工具僅供研究參考，不構成投資建議，也不會連接券商或下單。</p></main>
<div class="modal" id="modal"><section class="panel"><h2>分析偏好</h2><label for="api">API 服務網址（由部署者設定）</label><input id="api" placeholder="https://your-worker.workers.dev"><label for="horizon">投資期間</label><select id="horizon"><option>尚未設定</option><option>短線（數日到數週）</option><option>波段（數週到數月）</option><option>長期（1年以上）</option></select><label for="risk">風險承受度</label><select id="risk"><option>尚未設定</option><option>保守</option><option>中等</option><option>積極</option></select><div class="panel-actions"><button class="secondary" id="closeSettings">取消</button><button class="send" id="saveSettings">儲存設定</button></div></section></div>
<script>
const $=selector=>document.querySelector(selector),chat=$("#chat"),form=$("#form"),promptBox=$("#prompt");let history=[];
const settings=()=>({api:localStorage.getItem("api")||"",horizon:localStorage.getItem("horizon")||"尚未設定",risk:localStorage.getItem("risk")||"尚未設定"});
function add(text,role){const el=document.createElement("div");el.className="msg "+role;el.textContent=text;chat.appendChild(el);el.scrollIntoView({behavior:"smooth",block:"nearest"});return el}
$("#openSettings").onclick=()=>{$("#api").value=settings().api;$("#horizon").value=settings().horizon;$("#risk").value=settings().risk;$("#modal").classList.add("open")};
$("#closeSettings").onclick=()=>$("#modal").classList.remove("open");
$("#saveSettings").onclick=()=>{localStorage.setItem("api",$("#api").value.trim().replace(/\/$/,""));localStorage.setItem("horizon",$("#horizon").value);localStorage.setItem("risk",$("#risk").value);$("#modal").classList.remove("open")};
document.querySelectorAll(".chip").forEach(button=>button.onclick=()=>{promptBox.value=button.textContent;form.requestSubmit()});
promptBox.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();form.requestSubmit()}});
form.onsubmit=async event=>{event.preventDefault();const user=promptBox.value.trim();if(!user)return;const config=settings();if(!config.api){$("#modal").classList.add("open");add("請先在「設定」填入 API 服務網址，再送出分析問題。","assistant");return}add(user,"user");history.push({role:"user",content:user});promptBox.value="";$("#send").disabled=true;const loading=add("正在整理行情與近期資訊…","assistant");try{const response=await fetch(config.api+"/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages:history.slice(-8),horizon:config.horizon,risk:config.risk})});const data=await response.json();if(!response.ok)throw new Error(data.error||("HTTP "+response.status));loading.textContent=data.answer||"目前沒有可顯示的回答。";history.push({role:"assistant",content:loading.textContent})}catch(error){loading.textContent="目前無法取得分析："+error.message+"\n請檢查 API 網址或稍後重試。";history.pop()}finally{$("#send").disabled=false;promptBox.focus()}};
</script></body></html>
